<script>
/* apply saved reading preferences before first paint */
try{
  var __d=document.documentElement,__t=JSON.parse(localStorage.getItem('pxd:theme'));
  if(__t==='dark'||__t==='glass')__t='dusk';else if(__t==='light')__t='paper';else if(__t==='kindle')__t='sepia';
  if(__t==='dusk'||__t==='paper'||__t==='sepia')__d.setAttribute('data-theme',__t);else __d.setAttribute('data-theme','dusk');
  var __f=JSON.parse(localStorage.getItem('pxd:fs'));
  if(__f>=12&&__f<=28)__d.style.setProperty('--fs',__f+'px');
  var __lh=JSON.parse(localStorage.getItem('pxd:lh'));
  if(__lh>=1.5&&__lh<=2.4)__d.style.setProperty('--lh',String(__lh));
  var __m=document.querySelector('meta[name=theme-color]');
  if(__m)__m.setAttribute('content',{dusk:'#1d1916',paper:'#f1e9d9',sepia:'#e6d6b4'}[__d.getAttribute('data-theme')]);
}catch(e){}
</script>
