<template id="tpl-s1">
<p><strong>Python</strong> واحدة من أشهر لغات البرمجة في العالم دلوقتي — من ورا الذكاء الاصطناعي (ChatGPT وأغلب أدوات الـ AI)، تحليل البيانات، الأتمتة، ومواقع كبيرة زي Instagram وSpotify.</p>
<p>السبب الرئيسي في شهرتها: <strong>سهلة القراءة جداً</strong>. لو قارنتها بلغات زي JavaScript أو C++، هتلاقي بايثون شبه الإنجليزي العادي أكتر من أي لغة تانية.</p>
<div class="js-compare"><strong>🔀 فرق جوهري عن JS:</strong> Python <strong>مالهاش</strong> أقواس معقوفة <code>{ }</code> للـ blocks، ولا فاصلة منقوطة <code>;</code> في آخر السطر. بدل كده، بتستخدم <strong>المسافات البادئة (Indentation)</strong> عشان تحدد إيه اللي جوا إيه. ده مش اختياري — هو جزء رسمي من قواعد اللغة.</p></div>
<h4>أول أمر: print()</h4>
<p>زي ما اتعلمت console.log في JS، في بايثون بنستخدم <code>print()</code> عشان نطبع أي حاجة على الشاشة:</p>
<pre><code>print("أي كلام تحب تطبعه")</code></pre>
<p>لاحظ: <strong>مفيش فاصلة منقوطة في الآخر!</strong> نهاية السطر نفسها هي اللي بتقول لبايثون "خلص الأمر ده".</p>
</template>

<template id="tpl-s2">
<p>التعليقات في بايثون بتبدأ بعلامة <code>#</code> — وأي كلام بعدها في نفس السطر بيتجاهل تماماً.</p>
<pre><code># ده تعليق سطر واحد
score = 0  # كمان ينفع تحطه بعد الكود في نفس السطر</code></pre>
<div class="gotcha"><strong>⚠️ فرق عن JS:</strong> بايثون <strong>مالهاش</strong> تعليق متعدد الأسطر زي <code>/* */</code>. لو عايز تعلّق على فقرة كبيرة، بتكرر <code>#</code> في كل سطر، أو تستخدم نص بين 3 علامات اقتباس <code>"""..."""</code> (تقنياً ده نص عادي، بس بيتستخدم عملياً كتعليق كبير لو مش متصل بمتغير).</p></div>
<pre><code># الطريقة الشائعة لتعليق كبير:
# السطر الأول من الشرح
# السطر التاني من الشرح

"""
أو الطريقة دي:
نص كامل بين 3 علامات اقتباس
"""</code></pre>
</template>

<template id="tpl-s3">
<p>في JavaScript اتعلمت إنك لازم تكتب <code>let</code> أو <code>const</code> قبل أي متغير. في بايثون، <strong>مفيش أي كلمة مطلوبة خالص</strong> — بس اسم = قيمة:</p>
<pre><code>player_name = "زيرو"
player_name = "زيرو الجبار"  # إعادة تعيين، عادي جداً</code></pre>
<div class="js-compare"><strong>🔀 فرق جوهري عن JS:</strong> مفيش <code>let</code> ولا <code>const</code> ولا <code>var</code>. بايثون بتعتبر أي <code>اسم = قيمة</code> تعريف متغير تلقائي. لو عايز قيمة "ثابتة" بمعنى Convention، المبرمجين بيكتبوا اسمها بحروف كبيرة كلها زي <code>MAX_SPEED = 120</code> — ده اتفاق بين المبرمجين بس، مش قاعدة تمنعك من تغييرها فعلياً.</p></div>
<h4>قواعد التسمية</h4>
<ul>
  <li>لازم يبدأ بحرف أو <code>_</code>، مش برقم</li>
  <li>حساس لحالة الحروف — <code>score</code> و <code>Score</code> مختلفين تماماً</li>
  <li><strong>الأسلوب المعتاد في بايثون:</strong> snake_case — يعني <code>player_name</code> مش <code>playerName</code> (اللي هي أسلوب JS)</li>
</ul>
</template>

<template id="tpl-s4">
<p>أهم 3 أنواع بيانات في بايثون، وكل نوع بينفصل عن التاني بوضوح:</p>
<table class="type-table">
<tr><th>النوع</th><th>مثال</th><th>type()</th></tr>
<tr><td>str (نص)</td><td><code>"أهلاً"</code></td><td><code>str</code></td></tr>
<tr><td>int (عدد صحيح)</td><td><code>25</code></td><td><code>int</code></td></tr>
<tr><td>float (عدد عشري)</td><td><code>19.99</code></td><td><code>float</code></td></tr>
<tr><td>bool (منطقي)</td><td><code>True</code> / <code>False</code></td><td><code>bool</code></td></tr>
</table>
<div class="js-compare"><strong>🔀 فرق جوهري عن JS:</strong> JS عندها نوع واحد بس للأرقام (Number). بايثون بتفرّق بين <strong>int</strong> (عدد صحيح زي 5) و<strong>float</strong> (عدد فيه فاصلة زي 5.0) — دول نوعين مختلفين رسمياً!</p></div>
<p>عشان تعرف نوع أي قيمة، استخدم <code>type()</code>:</p>
<pre><code>print(type(25))      # &lt;class 'int'&gt;

<template id="tpl-s6">
<p>العمليات الحسابية الأساسية:</p>
<table class="type-table">
<tr><th>العملية</th><th>الرمز</th><th>مثال</th></tr>
<tr><td>جمع / طرح / ضرب</td><td><code>+  -  *</code></td><td><code>5 * 3</code> → 15</td></tr>
<tr><td>قسمة عادية (بترجع float دايماً)</td><td><code>/</code></td><td><code>7 / 2</code> → 3.5</td></tr>
<tr><td>القسمة الصحيحة (Floor Division)</td><td><code>//</code></td><td><code>7 // 2</code> → 3</td></tr>
<tr><td>باقي القسمة</td><td><code>%</code></td><td><code>7 % 2</code> → 1</td></tr>
<tr><td>الأس</td><td><code>**</code></td><td><code>2 ** 10</code> → 1024</td></tr>
</table>
<div class="js-compare"><strong>🔀 فرق جوهري عن JS:</strong> بايثون <strong>مالهاش</strong> <code>++</code> ولا <code>--</code> خالص! لو عايز تزوّد متغير بواحد، لازم تكتب <code>x += 1</code>. جرب <code>x++</code> في بايثون وهتاخد SyntaxError فوراً.</p></div>
<h4>المقارنة</h4>
<pre><code>print(5 == 5)   # True
print(5 != 3)   # True
print(5 &gt; 3)    # True</code></pre>
<div class="note"><strong>خبر كويس:</strong> بايثون مالهاش فخ الـ <code>==</code> بتاع JS! معملش <code>===</code> أصلاً لأنه مش محتاجه — المقارنة بـ <code>==</code> في بايثون منطقية ومتوقعة من غير مفاجآت تحويل أنواع غريبة.</p></div>

/* ══════════════ PYODIDE ENGINE: تنفيذ بايثون حقيقي ══════════════ */
var pyodideInstance = null;
var pyReady = false;

async function initPyodide() {
  try {
    pyodideInstance = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/' });
    pyReady = true;
    document.getElementById('loadOverlay').classList.add('hide');
    document.getElementById('codeEditor').disabled = false;
    document.getElementById('runBtn').disabled = false;
    document.getElementById('checkBtn').disabled = false;
    renderStep(currentIndex);
  } catch (e) {
    document.querySelector('.load-title').textContent = 'حصلت مشكلة في تحميل بايثون 😔';
    document.querySelector('.load-sub').textContent = 'تأكد من اتصالك بالإنترنت وأعد تحميل الصفحة. (' + e.message + ')';
  }
}

function runIsolated(code, probeVars) {
  var logs = [];
  var error = null;
  var values = {};
  var types = {};
  var ns = pyodideInstance.globals.get('dict')();
  pyodideInstance.setStdout({ batched: function (msg) { logs.push(msg); } });
  try {
    pyodideInstance.runPython(code, { globals: ns });
    (probeVars || []).forEach(function (v) {
      try {
        var val = ns.get(v);
        values[v] = (val && typeof val.toJs === 'function') ? val.toJs() : val;
        types[v] = pyodideInstance.runPython(
          "(" + v + ").__class__.__name__ if '" + v + "' in dir() else None", { globals: ns }
        );
      } catch (e2) { values[v] = undefined; types[v] = null; }
    });
  } catch (e) {
    var lines = String(e.message || e).trim().split('\n');
    error = lines[lines.length - 1];
  }
  ns.destroy();
  return { logs: logs, error: error, values: values, types: types };
}

/* ══════════════ محرّك الخطوات (State + Render) ══════════════ */
var currentIndex = 0;

function doneKey(id) { return 'px_py_gs_done_' + id; }
function codeKey(id) { return 'px_py_gs_code_' + id; }
function isDone(id) { return localStorage.getItem(doneKey(id)) === '1'; }
function setDone(id) { localStorage.setItem(doneKey(id), '1'); }

function updateDots() {
  var track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STEPS.forEach(function (step, i) {
    var dot = document.createElement('div');
    dot.className = 'prog-dot' + (isDone(step.id) ? ' done' : '') + (i === currentIndex ? ' current' : '');
    track.appendChild(dot);
  });
}

function updateLN() {
  var n = editor.value.split('\n').length;
  var out = '';
  for (var i = 1; i <= n; i++) out += i + '<br>';
  lnDiv.innerHTML = out;
}

function saveCode() {
  var step = STEPS[currentIndex];
  if (step.type === 'code') localStorage.setItem(codeKey(step.id), editor.value);
}

function resetCode() {
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return;
  if (!confirm('إعادة ضبط الكود للنسخة الأصلية؟')) return;
  editor.value = step.starter;
  localStorage.removeItem(codeKey(step.id));
  updateLN();
  resetConsole();
}

function resetConsole() {
  consoleBody.innerHTML = '<div class="console-placeholder">اكتب كودك، واضغط ▶ تشغيل عشان تشوف النتيجة هنا...</div>';
}
function clearConsoleManual() { resetConsole(); }

function renderConsole(result) {
  consoleBody.innerHTML = '';
  if (result.logs.length === 0 && !result.error) { resetConsole(); return; }
  result.logs.forEach(function (l) {
    var d = document.createElement('div');
    d.className = 'console-line';
    d.textContent = l;
    consoleBody.appendChild(d);
  });
  if (result.error) {
    var e = document.createElement('div');
    e.className = 'console-error';
    e.textContent = '⛔ ' + result.error;
    consoleBody.appendChild(e);
  }
}

function runCode() {
  if (!pyReady) return null;
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return null;
  var result = runIsolated(editor.value, step.probeVars || []);
  renderConsole(result);
  return result;
}

  var el = document.getElementById('toast');

  el.className = 'toast ' + (type || 'ok') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 4200);
}

    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast(step.success || 'تمام! كمّل للي بعده 👍', 'ok');
  } else {
    toast(verdict.msg || 'حاول تاني، راجع التعليمات.', 'err');
  }
}

function renderTaskList(tasks) {
  var el = document.getElementById('taskList');
  if (!tasks || !tasks.length) { el.innerHTML = ''; return; }
  var html = '<div class="task-list-title">المطلوب في الخطوة دي</div>';
  tasks.forEach(function (t, i) {
    html += '<div class="task-item"><div class="task-num">' + (ARABIC_NUM[i + 1] || (i + 1)) + '</div><div>' + t + '</div></div>';
  });
  el.innerHTML = html;
}

function renderQuiz(step) {
  var wrap = document.getElementById('quizContainer');
  var html = '';
  step.questions.forEach(function (q, qi) {
    html += '<div class="quiz-q" id="quizQ' + qi + '">';
    html += '<div class="quiz-q-title">' + (ARABIC_NUM[qi + 1] || (qi + 1)) + '. ' + q.q + '</div>';
    q.options.forEach(function (opt, oi) {
      html += '<label class="quiz-opt"><input type="radio" name="qz' + qi + '" value="' + oi + '" onchange="quizAnswers[' + qi + ']=' + oi + '"> <span>' + opt + '</span></label>';
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function gradeQuiz(step) {
  var score = 0;
  step.questions.forEach(function (q, qi) {
    var qEl = document.getElementById('quizQ' + qi);
    qEl.classList.remove('correct', 'wrong');
    if (quizAnswers[qi] === q.correct) { qEl.classList.add('correct'); score++; }
    else if (quizAnswers[qi] !== undefined) { qEl.classList.add('wrong'); }
  });
  if (score === step.questions.length) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast('🏆 ' + score + '/' + step.questions.length + ' — ممتاز! الدرس خلص.', 'ok');
  } else {
    toast('حصلت على ' + score + '/' + step.questions.length + ' — راجع الأسئلة المعلّمة باللون الوردي وحاول تاني.', 'err');
  }
}

function finishLesson() {
  localStorage.setItem('px-py-getting-started', 'done');
  window.location.href = 'menu.html';
}

function renderStep(i) {
  currentIndex = i;
  var step = STEPS[i];
  document.getElementById('stepLabel').textContent = (i + 1) + '/' + STEPS.length;
  updateDots();
  document.getElementById('insBadge').textContent = step.badge;
  document.getElementById('insTitle').textContent = step.title;
  var body = document.getElementById('insBody');
  body.innerHTML = '';
  body.appendChild(document.getElementById('tpl-' + step.id).content.cloneNode(true));
  renderTaskList(step.tasks);
  var hintEl = document.getElementById('hintBox');
  if (step.hint) { hintEl.style.display = 'block'; hintEl.innerHTML = '<strong>تلميح:</strong> ' + step.hint; }
  else { hintEl.style.display = 'none'; }

  var runBtn = document.getElementById('runBtn');
  var checkBtn = document.getElementById('checkBtn');

  if (step.type === 'quiz') {
    wsBody.classList.add('wide-mode');
    quizAnswers = {};
    renderQuiz(step);
    runBtn.style.display = 'none';
    checkBtn.textContent = '✓ تحقق من الإجابات';
  } else {
    wsBody.classList.remove('wide-mode');
    runBtn.style.display = 'inline-flex';
    checkBtn.textContent = '✓ تحقق من الخطوة';
    var saved = localStorage.getItem(codeKey(step.id));
    editor.value = (saved !== null) ? saved : step.starter;
    updateLN();
    resetConsole();
  }

  document.getElementById('prevBtn').disabled = (i === 0);
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.toggle('visible', isDone(step.id));
  nextBtn.textContent = (i === STEPS.length - 1) ? 'إنهاء الدرس 🚀' : 'التالي ←';
}

function goPrev() { if (currentIndex > 0) renderStep(currentIndex - 1); }
function goNext() {
  if (currentIndex === STEPS.length - 1) { finishLesson(); return; }
  if (currentIndex < STEPS.length - 1) renderStep(currentIndex + 1);
}

/* ══════════════ الإعداد الأولي ══════════════ */
var runTimer;
editor.addEventListener('input', function () {
  updateLN(); saveCode();
  clearTimeout(runTimer);
  runTimer = setTimeout(runCode, 700);
});
editor.addEventListener('scroll', function () { lnDiv.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  var s = editor.selectionStart, en = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + '    ' + editor.value.slice(en);
  editor.selectionStart = editor.selectionEnd = s + 4;
  updateLN(); saveCode();
});

(function init() {
  var start = 0;
  for (var i = 0; i < STEPS.length; i++) { if (!isDone(STEPS[i].id)) { start = i; break; } if (i === STEPS.length - 1) start = i; }
  currentIndex = start;
  document.getElementById('insBadge').textContent = STEPS[start].badge;
  document.getElementById('insTitle').textContent = STEPS[start].title;
  document.getElementById('insBody').appendChild(document.getElementById('tpl-' + STEPS[start].id).content.cloneNode(true));
  renderTaskList(STEPS[start].tasks);
  initPyodide();
})();
</script>
