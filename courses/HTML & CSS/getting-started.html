<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{

}
body{font-family:'Cairo',sans-serif;background:var(--void);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}

.ws-header{background:var(--card);border-bottom:1px solid var(--border);padding:0 18px;height:50px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.ws-logo{font-family:'Cairo',sans-serif;font-weight:800;font-size:15px;color:var(--neon);text-decoration:none;letter-spacing:-.5px;}
.ws-sep{color:var(--muted);font-size:18px;}
.ws-title{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ws-spacer{flex:1;}
.progress-track{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;}
.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:1px solid var(--muted);transition:all .3s;flex-shrink:0;}

.prog-dot.current{background:transparent;border:2px solid var(--neon);}
.ws-step-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-right:8px;flex-shrink:0;}

.ws-body{display:grid;grid-template-columns:420px 1fr 340px;flex:1;overflow:hidden;}
.ws-body.wide-mode{grid-template-columns:1fr;}
.ws-body.wide-mode .ws-editor,.ws-body.wide-mode .ws-preview{display:none;}

.ws-instructions{background:var(--surface);border-left:1px solid var(--border);overflow-y:auto;padding:22px 22px 40px;display:flex;flex-direction:column;gap:14px;}
.ws-body.wide-mode .ws-instructions{max-width:760px;margin:0 auto;width:100%;border-left:none;}
.ws-instructions::-webkit-scrollbar-thumb{background:rgba(var(--px-accent-rgb),.3);}
.ins-badge{display:inline-flex;align-items:center;gap:6px;background:var(--neon-dim);border:1px solid var(--border2);border-radius:100px;padding:3px 12px;font-size:11px;font-weight:700;color:var(--neon);letter-spacing:.5px;width:fit-content;}
.ins-title{font-family:'Cairo',sans-serif;font-size:1.25rem;font-weight:800;color:var(--px-text-strong);line-height:1.35;}

.ins-body{font-size:13.5px;line-height:1.85;color:var(--text);display:flex;flex-direction:column;gap:12px;}
.ins-body h4{font-family:'Cairo',sans-serif;font-size:.92rem;font-weight:700;color:var(--accent);margin-top:4px;}
.ins-body p{margin:0;}
.ins-body ul{padding-right:20px;display:flex;flex-direction:column;gap:5px;}
.ins-body strong{color:var(--px-text-strong);}
.ins-body code{background:rgba(var(--px-accent-rgb),.08);border:1px solid rgba(var(--px-accent-rgb),.18);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--px-c-green);direction:ltr;display:inline-block;unicode-bidi:isolate;}

.note{border-right:3px solid;padding:11px 14px;border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.75;}
.note.warn{border-color:var(--gold);background:rgba(var(--px-c-yellow-rgb),.06);color:var(--px-c-yellow);}
.note.info{border-color:var(--blue);background:rgba(var(--px-c-blue-rgb),.06);color:var(--px-c-blue);}
.note.good{border-color:var(--neon);background:var(--neon-dim);color:var(--px-c-green);}
.note strong{color:inherit;}

.analogy{background:rgba(var(--px-c-blue-rgb),.06);border:1px solid rgba(var(--px-c-blue-rgb),.18);border-radius:10px;padding:13px 16px;font-size:12.5px;line-height:1.8;color:var(--px-c-blue);}
.analogy strong{color:var(--blue);}

.sv-list{display:flex;flex-direction:column;gap:8px;}
.sv-step{display:flex;align-items:flex-start;gap:11px;background:rgba(var(--px-shade-rgb),calc(.25*var(--px-shade-k)));border:1px solid var(--border);border-radius:9px;padding:10px 13px;}
.sv-num{min-width:24px;height:24px;border-radius:7px;background:var(--neon-dim);border:1px solid var(--border2);color:var(--neon);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sv-content h5{color:var(--px-text-strong);font-size:12.5px;margin-bottom:2px;}
.sv-content p{color:var(--muted);font-size:11.5px;margin:0;line-height:1.6;}

.ann-code{background:var(--px-code-bg);border:1px solid var(--border);border-radius:9px;overflow:hidden;font-family:'JetBrains Mono',monospace;direction:ltr;text-align:left;--px-text:#cdd6e2;--px-text-strong:#eef2f7;--px-muted:#8b99ab;--px-faint:#6c7b8e;--px-line:rgba(190,205,225,.10);--px-line-strong:rgba(190,205,225,.22);--px-ink-rgb:190,205,225;--px-accent:#6fc3a3;--px-accent-rgb:111,195,163;--px-card:#1e2731;--px-card2:#242f3b;--text:#cdd6e2;--muted:#8b99ab;--border:rgba(190,205,225,.10);--border2:rgba(111,195,163,.22);--card:#1e2731;--card2:#262f3a;--surface:#181d24;--bg2:#181d24;--px-shade-rgb:0,0,0;--px-shade-k:1;--px-c-red:#e68f8f;--px-c-red-rgb:230,143,143;--px-c-orange:#dba078;--px-c-orange-rgb:219,160,120;--px-c-yellow:#e0c27a;--px-c-yellow-rgb:224,194,122;--px-c-green:#9fcf95;--px-c-green-rgb:159,207,149;--px-c-cyan:#7cc4d8;--px-c-cyan-rgb:124,196,216;--px-c-blue:#85b4ee;--px-c-blue-rgb:133,180,238;--px-c-purple:#b8a6e8;--px-c-purple-rgb:184,166,232;--px-c-pink:#dc9bbd;--px-c-pink-rgb:220,155,189;;--neon:var(--px-accent);--neon-dim:rgba(var(--px-accent-rgb),.1);--void:var(--px-bg);--surface:var(--px-surface);--editor:var(--px-code-bg);--card:var(--px-card);--border:var(--px-line);--border2:rgba(var(--px-accent-rgb),.22);--text:var(--px-text);--muted:var(--px-muted);--accent:var(--px-c-green);--blue:var(--px-c-blue);--pink:var(--px-c-red);--gold:var(--px-c-yellow)}
.ann-line{display:flex;align-items:flex-start;border-bottom:1px solid rgba(var(--px-ink-rgb),.03);}
.ann-line:last-child{border-bottom:none;}
.ann-num{min-width:26px;padding:6px 6px;text-align:right;color:var(--muted);font-size:10.5px;border-left:1px solid rgba(var(--px-ink-rgb),.04);flex-shrink:0;}
.ann-code-txt{padding:6px 10px;flex:1;color:var(--px-text);white-space:pre;font-size:11.5px;}
.ann-note{padding:6px 8px 6px 0;font-size:10.5px;color:var(--muted);font-family:'Cairo',sans-serif;direction:rtl;min-width:130px;max-width:150px;flex-shrink:0;line-height:1.5;border-right:1px solid rgba(var(--px-accent-rgb),.1);}
.ann-note.hl{color:var(--neon);}
.tag{color:var(--px-c-red);} .attr{color:var(--px-c-orange);} .val{color:var(--px-c-green);} .cm{color:var(--px-muted);font-style:italic;} .plain{color:var(--px-text);}

.task-list{background:rgba(var(--px-shade-rgb),calc(.3*var(--px-shade-k)));border:1px solid var(--border2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.task-list:empty{display:none;}
.task-list-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
.task-item{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.65;}
.task-num{min-width:20px;height:20px;border-radius:50%;background:var(--neon-dim);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--neon);flex-shrink:0;margin-top:2px;}
.hint{background:rgba(var(--px-c-green-rgb),.05);border:1px solid rgba(var(--px-c-green-rgb),.18);border-radius:8px;padding:11px 13px;font-size:12px;color:var(--accent);line-height:1.65;display:none;}
.hint strong{color:var(--px-text-strong);}

.editor-tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:stretch;height:38px;flex-shrink:0;}
.file-tab{display:inline-flex;align-items:center;gap:6px;padding:0 15px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);border-bottom:2px solid var(--neon);}
.tab-dot{width:6px;height:6px;border-radius:50%;background:var(--px-c-red);}
.editor-action{margin-right:auto;display:flex;align-items:center;padding-left:10px;}
.btn-reset{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 9px;border-radius:5px;cursor:pointer;font-family:'Cairo',sans-serif;transition:all .2s;}
.btn-reset:hover{border-color:var(--muted);color:var(--text);}
.editor-body{flex:1;display:flex;overflow:hidden;}
.line-nums{background:var(--editor);color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65;padding:16px 8px 16px 10px;min-width:42px;text-align:right;overflow:hidden;user-select:none;flex-shrink:0;border-left:1px solid rgba(var(--px-ink-rgb),.03);--px-text:#cdd6e2;--px-text-strong:#eef2f7;--px-muted:#8b99ab;--px-faint:#6c7b8e;--px-line:rgba(190,205,225,.10);--px-line-strong:rgba(190,205,225,.22);--px-ink-rgb:190,205,225;--px-accent:#6fc3a3;--px-accent-rgb:111,195,163;--px-card:#1e2731;--px-card2:#242f3b;--text:#cdd6e2;--muted:#8b99ab;--border:rgba(190,205,225,.10);--border2:rgba(111,195,163,.22);--card:#1e2731;--card2:#262f3a;--surface:#181d24;--bg2:#181d24;--px-shade-rgb:0,0,0;--px-shade-k:1;--px-c-red:#e68f8f;--px-c-red-rgb:230,143,143;--px-c-orange:#dba078;--px-c-orange-rgb:219,160,120;--px-c-yellow:#e0c27a;--px-c-yellow-rgb:224,194,122;--px-c-green:#9fcf95;--px-c-green-rgb:159,207,149;--px-c-cyan:#7cc4d8;--px-c-cyan-rgb:124,196,216;--px-c-blue:#85b4ee;--px-c-blue-rgb:133,180,238;--px-c-purple:#b8a6e8;--px-c-purple-rgb:184,166,232;--px-c-pink:#dc9bbd;--px-c-pink-rgb:220,155,189;;--neon:var(--px-accent);--neon-dim:rgba(var(--px-accent-rgb),.1);--void:var(--px-bg);--surface:var(--px-surface);--editor:var(--px-code-bg);--card:var(--px-card);--border:var(--px-line);--border2:rgba(var(--px-accent-rgb),.22);--text:var(--px-text);--muted:var(--px-muted);--accent:var(--px-c-green);--blue:var(--px-c-blue);--pink:var(--px-c-red);--gold:var(--px-c-yellow)}
.code-ed{flex:1;background:transparent;color:var(--px-text);font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.65;padding:16px;border:none;outline:none;resize:none;direction:ltr!important;text-align:left!important;white-space:pre;overflow:auto;tab-size:2;}
.code-ed::selection{background:rgba(var(--px-accent-rgb),.15);}

.ws-preview{display:flex;flex-direction:column;overflow:hidden;}
.preview-bar{background:var(--card);border-bottom:1px solid var(--border);height:38px;padding:0 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.preview-dots{display:flex;gap:5px;}
.pdot{width:9px;height:9px;border-radius:50%;}
.pdot.r{background:var(--px-c-red);}.pdot.y{background:var(--px-c-orange);}.pdot.g{background:var(--neon);}
.preview-url{background:rgba(var(--px-ink-rgb),.04);border:1px solid var(--border);border-radius:5px;padding:3px 10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);flex:1;text-align:center;direction:ltr;}
#previewFrame{flex:1;border:none;background:var(--px-paper);--px-text:#2a303c;--px-text-strong:#161b25;--px-muted:#5d6879;--px-faint:#8a94a4;--px-line:rgba(40,50,70,.10);--px-line-strong:rgba(40,50,70,.20);--px-ink-rgb:40,50,70;--px-accent:#15735e;--px-accent-rgb:21,115,94;--px-c-red:#b24545;--px-c-red-rgb:178,69,69;--px-c-orange:#a85a22;--px-c-orange-rgb:168,90,34;--px-c-yellow:#8a6410;--px-c-yellow-rgb:138,100,16;--px-c-green:#2f6b3a;--px-c-green-rgb:47,107,58;--px-c-cyan:#1f6e82;--px-c-cyan-rgb:31,110,130;--px-c-blue:#2d5fa6;--px-c-blue-rgb:45,95,166;--px-c-purple:#5d4a9c;--px-c-purple-rgb:93,74,156;--px-c-pink:#a8456e;--px-c-pink-rgb:168,69,110;color:var(--px-text);}

.ws-footer{background:var(--card);border-top:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;gap:9px;flex-shrink:0;}
.btn-nav{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .2s;font-family:'Cairo',sans-serif;}
.btn-nav:hover:not(:disabled){border-color:var(--muted);color:var(--text);}
.btn-nav:disabled{opacity:.3;cursor:not-allowed;}
.btn-run{display:inline-flex;align-items:center;gap:6px;padding:7px 18px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;background:rgba(var(--px-accent-rgb),.1);color:var(--neon);border:1px solid var(--border2);transition:all .2s;font-family:'Cairo',sans-serif;}
.btn-run:hover{background:rgba(var(--px-accent-rgb),.18);}
.f-spacer{flex:1;}

.btn-check:hover{box-shadow:0 0 24px rgba(var(--px-accent-rgb),.5);transform:translateY(-1px);}
#nextBtn{display:none;background:rgba(var(--px-accent-rgb),.12);color:var(--neon);border:1px solid var(--border2);}
#nextBtn.visible{display:inline-flex;}

.toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 20px;font-size:13px;opacity:0;transition:all .3s;z-index:999;max-width:440px;min-width:200px;text-align:center;white-space:pre-line;pointer-events:none;line-height:1.6;}

.toast.err{border-color:var(--pink);color:var(--pink);}

.quiz-container{display:none;flex-direction:column;gap:16px;}

.quiz-q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .25s;}
.quiz-q.correct{border-color:rgba(var(--px-c-green-rgb),.5);background:rgba(var(--px-c-green-rgb),.04);}
.quiz-q.wrong{border-color:rgba(var(--px-c-red-rgb),.5);background:rgba(var(--px-c-red-rgb),.04);}
.quiz-q-title{font-weight:700;font-size:13.5px;margin-bottom:12px;line-height:1.6;}
.quiz-opt{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:background .2s;}
.quiz-opt:hover{background:rgba(var(--px-ink-rgb),.03);}
.quiz-opt input{accent-color:var(--neon);width:15px;height:15px;flex-shrink:0;}

  <div class="sv-step"><div class="sv-num">٣</div><div class="sv-content"><h5>المتصفح بيجمّع الصفحة</h5><p>المتصفح بيستلم 3 أنواع ملفات: <code>HTML</code> (الهيكل) + <code>CSS</code> (التنسيق) + <code>JavaScript</code> (التفاعل)</p></div></div>

</div>
<div class="analogy">🏠 <strong>تشبيه البيت:</strong> فكّر في بناء موقع زي بناء بيت.<br>
<strong>HTML</strong> = الحيطان والأعمدة والسقف (الهيكل الأساسي)<br>
<strong>CSS</strong> = الدهانات والديكور والإضاءة (الشكل والجمال)<br>
<strong>JavaScript</strong> = الكهربا والسباكة والأسانسير (التفاعل والحركة)</div>
<p>إحنا هنبدأ بـ HTML — الهيكل. وأحسن طريقة تفهمه بيها إنك تكتب سطر وتشوفه بنفسك فوراً. جرّب دلوقتي 👉</p>
</template>

<template id="tpl-s2">
<p><strong>HTML</strong> اختصار لـ <strong>HyperText Markup Language</strong> — مش لغة برمجة بالمعنى الحقيقي، دي <strong>لغة وصفية</strong>: إنت بتوصف للمتصفح إيه اللي المفروض يعرضه.</p>
<div class="note info"><strong>HyperText</strong> = نصوص فيها روابط بتنقلك بين صفحات تانية<br><strong>Markup</strong> = "تعليم" النص بعلامات خاصة (Tags) عشان تحدد معناه<br><strong>Language</strong> = لغة ليها قواعد لازم تتبعها</div>
<h4>الـ Tags إيه بالظبط؟</h4>
<p>الـ Tag كلمة متغلفة بين علامتي أصغر من وأكبر من. وأي محتوى في HTML بيتحط <strong>بين tag فتح وtag قفل</strong>:</p>
<pre style="background:var(--px-bg);border:1px solid var(--border);border-radius:9px;padding:12px 14px;direction:ltr;text-align:left;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--px-c-green);">&lt;h1&gt;مرحباً بالعالم&lt;/h1&gt;
     ↑ فتح      ↑ محتوى      ↑ قفل (لاحظ /)</pre>
<h4>وسوم مش محتاجة قفل (Self-Closing)</h4>
<p>بعض العناصر مالهاش محتوى جواها — زي الصور وفواصل الأسطر. دي مش محتاجة tag قفل:</p>
<ul>
  <li><code>&lt;br&gt;</code> — بينزل سطر جديد</li>
  <li><code>&lt;img src="صورة.jpg"&gt;</code> — بيعرض صورة</li>
  <li><code>&lt;hr&gt;</code> — بيرسم خط أفقي فاصل</li>
</ul>
</template>

<p><strong>UTF-8</strong> معيار ترميز بيدعم كل حروف العالم. من غيره الحروف العربية هتظهر كرموز غريبة زي <code>ط±ط¨ظˆط·</code>. و<code>lang="ar"</code> بتقول لمحركات البحث إن لغة صفحتك عربي.</p>

<template id="tpl-s4">

<template id="tpl-s5">
<p>خلينا نبني صفحة تعريف شخصية حقيقية — بنفس الطريقة اللي هتستخدمها في أي بورتفوليو أو سيرة ذاتية أونلاين.</p>
<h4>العناصر اللي هتحتاجها</h4>
<ul>
  <li><code>&lt;h1&gt;</code> — عنوان رئيسي كبير، واحد بس في كل صفحة (لازم يكون فريد)</li>
  <li><code>&lt;h2&gt;</code> — عنوان ثانوي، أصغر من h1، ينفع منه أكتر من واحد</li>
  <li><code>&lt;p&gt;</code> — فقرة نصية عادية، أغلب كلامك هيتكتب هنا</li>
  <li><code>&lt;a href="..."&gt;</code> — رابط. الـ <code>href</code> بيحدد الوجهة، والنص بينهم هو اللي بيتشاف ويتداس عليه</li>
</ul>
<div class="note info">المتصفح بيضيف تنسيق افتراضي تلقائي — h1 كبير وغامق، h2 أصغر، الروابط لونها أزرق. في درس CSS هتتعلم تتحكم في كل التفاصيل دي بنفسك.</div>
</template>

<template id="tpl-s6">
<p>في الكود اللي في المحرر <strong>3 أخطاء شائعة جداً</strong> بيقع فيها كل مبرمج مبتدئ (وأحياناً المحترفين كمان!). كلها أخطاء إملائية بسيطة، بس بتمنع الصفحة من الشغل صح.</p>
<p>مهمتك تكتشفهم وتصلحهم. الصفحة المفروض في الآخر يبقى فيها:</p>
<ul>
  <li>عنوان <code>h1</code> واحد بس (حوّل التاني لـ <code>h2</code>)</li>
  <li>صورة بخاصية <code>src</code> صح</li>
  <li>رابط بخاصية <code>href</code> صح</li>
</ul>
<div class="note warn"><strong>إزاي تصطاد الأخطاء زي المحترفين:</strong> راجع اسم كل خاصية حرف حرف. أخطاء زي <code>scr</code> بدل <code>src</code>، أو <code>herf</code> بدل <code>href</code> هي أكتر أخطاء المبتدئين شيوعاً في الدنيا كلها — وميظهرش عليها أي تحذير في المتصفح!</div>
</template>

      { q: 'اختصار Emmet في VS Code لكتابة هيكل HTML كامل؟', options: ['اكتب html ثم Enter', 'اكتب ! ثم Tab', 'اكتب # ثم Space', 'اكتب start ثم Tab'], correct: 1 },
      { q: 'كام h1 المفروض يكون في الصفحة الواحدة؟', options: ['واحد بس', 'اتنين', 'بلا حدود', 'صفر'], correct: 0 }
    ]
  }
];

/* ══════════════ محرّك الخطوات ══════════════ */
var currentIndex = 0;
var editor = document.getElementById('codeEditor');
var lnDiv = document.getElementById('lineNums');
var wsBody = document.getElementById('wsBody');
var quizAnswers = {};

function doneKey(id) { return 'px_html_gs_done_' + id; }
function codeKey(id) { return 'px_html_gs_code_' + id; }
function isDone(id) { return localStorage.getItem(doneKey(id)) === '1'; }
function setDone(id) { localStorage.setItem(doneKey(id), '1'); }

function updateDots() {
  var track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STEPS.forEach(function (step, i) {
    var dot = document.createElement('div');
    dot.className = 'prog-dot' + (isDone(step.id) ? ' done' : '') + (i === currentIndex ? ' current' : '');
    track.appendChild(dot);
  });
}

function updateLN() {
  var n = editor.value.split('\n').length;
  var out = '';
  for (var i = 1; i <= n; i++) out += i + '<br>';
  lnDiv.innerHTML = out;
}

function saveCode() {
  var step = STEPS[currentIndex];
  if (step.type === 'code') localStorage.setItem(codeKey(step.id), editor.value);
}

function resetCode() {
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return;
  if (!confirm('إعادة ضبط الكود للنسخة الأصلية؟')) return;
  editor.value = step.starter;
  localStorage.removeItem(codeKey(step.id));
  updateLN();
  runCode();
}

function runCode() {
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return null;
  var doc = renderAndProbe(editor.value);
  return doc;
}

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'ok') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 4200);
}

function checkStep() {
  var step = STEPS[currentIndex];
  if (step.type === 'quiz') { gradeQuiz(step); return; }
  if (step.type === 'info') { markInfoDone(step); return; }
  var doc = runCode();
  var verdict = step.check(doc, editor.value);
  if (verdict.ok) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast(step.success || 'تمام! كمّل للي بعده 👍', 'ok');
  } else {
    toast(verdict.msg || 'حاول تاني، راجع التعليمات.', 'err');
  }
}

function markInfoDone(step) {
  setDone(step.id);
  document.getElementById('nextBtn').classList.add('visible');
  updateDots();
  toast('تمام، يلا نكمل 👍', 'ok');
}

function renderTaskList(tasks) {
  var el = document.getElementById('taskList');
  if (!tasks || !tasks.length) { el.innerHTML = ''; return; }
  var html = '<div class="task-list-title">المطلوب في الخطوة دي</div>';
  tasks.forEach(function (t, i) {
    html += '<div class="task-item"><div class="task-num">' + (ARABIC_NUM[i + 1] || (i + 1)) + '</div><div>' + t + '</div></div>';
  });
  el.innerHTML = html;
}

function renderQuiz(step) {
  var wrap = document.getElementById('quizContainer');
  var html = '';
  step.questions.forEach(function (q, qi) {
    html += '<div class="quiz-q" id="quizQ' + qi + '">';
    html += '<div class="quiz-q-title">' + (ARABIC_NUM[qi + 1] || (qi + 1)) + '. ' + q.q + '</div>';
    q.options.forEach(function (opt, oi) {
      html += '<label class="quiz-opt"><input type="radio" name="qz' + qi + '" value="' + oi + '" onchange="quizAnswers[' + qi + ']=' + oi + '"> <span>' + opt + '</span></label>';
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function gradeQuiz(step) {
  var score = 0;
  step.questions.forEach(function (q, qi) {
    var qEl = document.getElementById('quizQ' + qi);
    qEl.classList.remove('correct', 'wrong');
    if (quizAnswers[qi] === q.correct) { qEl.classList.add('correct'); score++; }
    else if (quizAnswers[qi] !== undefined) { qEl.classList.add('wrong'); }
  });
  if (score === step.questions.length) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast('🏆 ' + score + '/' + step.questions.length + ' — ممتاز! الدرس خلص.', 'ok');
  } else {
    toast('حصلت على ' + score + '/' + step.questions.length + ' — راجع الأسئلة المعلّمة باللون الوردي.', 'err');
  }
}

function finishLesson() {
  localStorage.setItem('getting-started', 'completed');
  window.location.href = 'menu.html';
}

function renderStep(i) {
  currentIndex = i;
  var step = STEPS[i];
  document.getElementById('stepLabel').textContent = (i + 1) + '/' + STEPS.length;
  updateDots();
  document.getElementById('insBadge').textContent = step.badge;
  document.getElementById('insTitle').textContent = step.title;
  var body = document.getElementById('insBody');
  body.innerHTML = '';
  body.appendChild(document.getElementById('tpl-' + step.id).content.cloneNode(true));
  renderTaskList(step.tasks);
  var hintEl = document.getElementById('hintBox');
  if (step.hint) { hintEl.style.display = 'block'; hintEl.innerHTML = '<strong>تلميح:</strong> ' + step.hint; }
  else { hintEl.style.display = 'none'; }

  var runBtn = document.getElementById('runBtn');
  var checkBtn = document.getElementById('checkBtn');

  if (step.type === 'quiz') {
    wsBody.classList.add('wide-mode');
    quizAnswers = {};
    renderQuiz(step);
    runBtn.style.display = 'none';
    checkBtn.style.display = 'inline-flex';
    checkBtn.textContent = '✓ تحقق من الإجابات';
  } else if (step.type === 'info') {
    wsBody.classList.add('wide-mode');
    runBtn.style.display = 'none';
    checkBtn.style.display = 'inline-flex';
    checkBtn.textContent = 'فهمت، التالي ←';
  } else {
    wsBody.classList.remove('wide-mode');
    runBtn.style.display = 'inline-flex';
    checkBtn.style.display = 'inline-flex';
    checkBtn.textContent = '✓ تحقق من الخطوة';
    var saved = localStorage.getItem(codeKey(step.id));
    editor.value = (saved !== null) ? saved : step.starter;
    updateLN();
    runCode();
  }

  document.getElementById('prevBtn').disabled = (i === 0);
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.toggle('visible', isDone(step.id));
  nextBtn.textContent = (i === STEPS.length - 1) ? 'إنهاء الدرس 🚀' : 'التالي ←';
}

function goPrev() { if (currentIndex > 0) renderStep(currentIndex - 1); }
function goNext() {
  if (currentIndex === STEPS.length - 1) { finishLesson(); return; }
  if (currentIndex < STEPS.length - 1) renderStep(currentIndex + 1);
}

/* ══════════════ الإعداد الأولي ══════════════ */
var runTimer;
editor.addEventListener('input', function () {
  updateLN(); saveCode();
  clearTimeout(runTimer);
  runTimer = setTimeout(runCode, 700);
});
editor.addEventListener('scroll', function () { lnDiv.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  var s = editor.selectionStart, en = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
  editor.selectionStart = editor.selectionEnd = s + 2;
  updateLN(); saveCode();
});

(function init() {
  var start = 0;
  for (var i = 0; i < STEPS.length; i++) { if (!isDone(STEPS[i].id)) { start = i; break; } if (i === STEPS.length - 1) start = i; }
  renderStep(start);
})();
</script>
</body>
</html>
