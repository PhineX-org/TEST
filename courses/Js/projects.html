<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dusk">
<head>
<meta name="theme-color" content="#14181e">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/tokens.css">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع العملية | JavaScript · PhineX Academy</title>
<meta name="description" content="مشاريع JavaScript عملية تبنيها بإيدك خطوة بخطوة، مع شرح وتلميحات وتحقق فوري على كل خطوة — بأسلوب PhineX Lab.">
<link href="../../PhineX_Courses.png" rel="icon" type="image/png">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --neon:var(--px-accent); --neon-dim:rgba(var(--px-accent-rgb),.1);
  --void:var(--px-bg); --card:var(--px-card); --border:var(--px-line); --border2:rgba(var(--px-accent-rgb),.22);
  --text:var(--px-text); --muted:var(--px-muted); --accent:var(--px-c-green);
}
body{font-family:'Cairo',sans-serif;background:var(--void);color:var(--text);min-height:100vh;background-image:radial-gradient(circle at 1px 1px, rgba(var(--px-ink-rgb),.04) 1px, transparent 0);background-size:26px 26px;}
.wrap{max-width:980px;margin:0 auto;padding:34px 20px 70px;}
.top-nav{display:flex;align-items:center;gap:10px;margin-bottom:34px;font-size:13px;color:var(--muted);}
.top-nav a{color:var(--neon);text-decoration:none;font-weight:700;}
.hero{text-align:center;margin-bottom:38px;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:var(--neon-dim);border:1px solid var(--border2);border-radius:100px;padding:5px 16px;font-size:12px;font-weight:700;color:var(--neon);margin-bottom:16px;}
.hero h1{font-family:'Cairo',sans-serif;font-weight:800;font-size:clamp(1.7rem,5vw,2.4rem);color:var(--px-text-strong);margin-bottom:10px;}
.hero p{color:var(--muted);font-size:14.5px;max-width:560px;margin:0 auto;line-height:1.8;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px 22px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;transition:border-color .25s,transform .25s;}
.pcard.live{border-color:var(--border2);}
.pcard.live:hover{transform:translateY(-3px);border-color:var(--neon);}
.pcard.soon{opacity:.55;}
.pcard-icon{font-size:30px;}
.pcard-title{font-family:'Cairo',sans-serif;font-size:1.05rem;font-weight:800;color:var(--px-text-strong);}
.pcard-desc{font-size:12.5px;color:var(--muted);line-height:1.75;flex:1;}
.pcard-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.pcard-dots{display:flex;gap:4px;}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--border);}
.pdot.done{background:var(--neon);}
.pcard-cta{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 0;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;transition:all .2s;}
.pcard.live .pcard-cta{background:var(--neon);color:var(--px-on-accent);}
.pcard.live .pcard-cta:hover{box-shadow:0 0 20px rgba(var(--px-accent-rgb),.4);}
.pcard.soon .pcard-cta{background:rgba(var(--px-ink-rgb),.05);color:var(--muted);cursor:default;pointer-events:none;}
.soon-tag{position:absolute;top:14px;left:14px;background:rgba(var(--px-ink-rgb),.06);border:1px solid var(--border);color:var(--muted);font-size:10px;padding:2px 10px;border-radius:100px;}
</style>
<link rel="stylesheet" href="../../assets/lesson.css">
<script src="../../assets/site.js"></script>
</head>
<body data-px-tools>
<div class="wrap">
  <div class="top-nav">
    <a href="menu.html">← رجوع لقائمة درس JavaScript</a>
  </div>

  <div class="hero">
    <div class="hero-badge">🧪 PhineX Lab</div>
    <h1>المشاريع العملية</h1>
    <p>مش بس هتقرا وتتفرج — هتبني كل مشروع بإيدك، خطوة بخطوة، وكل خطوة ليها تعليمات وتلميح وتحقق فوري بيشغّل كودك فعليًا ويتأكد إنه شغال صح قبل ما يفتحلك اللي بعده.</p>
  </div>

  <div class="grid" id="projectsGrid"></div>
</div>

<script>
var PROJECTS = [
  {
    id: 'cc', icon: '🎮', title: 'بطاقة شخصية اللعبة',
    desc: 'ابني بطاقة شخصية كاملة لبطل خيالي: متغيرات، أنواع بيانات، عمليات حسابية ومقارنة، وTemplate Literals — كل ده في ٦ خطوات متدرجة.',
    steps: 6, href: 'projects/character-card/step1.html', status: 'live'
  },
  {
    id: 'inv', icon: '📦', title: 'نظام جرد ذكي',
    desc: 'مشروع قادم: تتبع مخزون كامل باستخدام الحلقات والمصفوفات — إضافة وحذف وبحث عن عناصر تلقائيًا.',
    steps: 0, href: '#', status: 'soon'
  },
  {
    id: 'calc', icon: '🧮', title: 'محرك حسابي',
    desc: 'مشروع قادم: آلة حاسبة ذكية متعددة العمليات، مبنية بالكامل على الدوال.',
    steps: 0, href: '#', status: 'soon'
  }
];

function countDone(p) {
  if (p.status !== 'live') return 0;
  var n = 0;
  for (var i = 1; i <= p.steps; i++) {
    if (localStorage.getItem('px_js_proj_' + p.id + '_final_' + i) !== null) n++;
  }
  return n;
}

function render() {
  var grid = document.getElementById('projectsGrid');
  grid.innerHTML = '';
  PROJECTS.forEach(function (p) {
    var done = countDone(p);
    var isLive = p.status === 'live';
    var card = document.createElement('div');
    card.className = 'pcard ' + (isLive ? 'live' : 'soon');
    var dots = '';
    for (var i = 1; i <= (p.steps || 6); i++) {
      dots += '<div class="pdot' + (i <= done ? ' done' : '') + '"></div>';
    }
    card.innerHTML =
      (isLive ? '' : '<div class="soon-tag">قريباً</div>') +
      '<div class="pcard-icon">' + p.icon + '</div>' +
      '<div class="pcard-title">' + p.title + '</div>' +
      '<div class="pcard-desc">' + p.desc + '</div>' +
      (isLive ? ('<div class="pcard-meta"><div class="pcard-dots">' + dots + '</div><span>' + done + '/' + p.steps + ' خطوات</span></div>') : '') +
      '<a class="pcard-cta" href="' + p.href + '">' + (isLive ? (done > 0 ? (done === p.steps ? '🎉 راجعه تاني' : 'كمّل من فين ما وقفت') : 'ابدأ المشروع →') : 'قريباً') + '</a>';
    grid.appendChild(card);
  });
}
render();
</script>
</body>
</html>
