<style>

  --blue:#82aaff; --pink:#ff5874; --cyan:#00d4ff;
}
body{font-family:'Cairo',sans-serif;background:var(--void);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px;}

.ws-spacer{flex:1;}

.prog-dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:1px solid var(--muted);transition:all .3s;flex-shrink:0;}
.prog-dot.done{background:var(--neon);border-color:var(--neon);box-shadow:0 0 6px rgba(247,223,30,.5);}
.prog-dot.current{background:transparent;border:2px solid var(--neon);}
.ws-step-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-right:8px;flex-shrink:0;}

/* BODY LAYOUT */

.ws-body.quiz-mode{grid-template-columns:1fr;}
.ws-body.quiz-mode .ws-editor,.ws-body.quiz-mode .ws-console{display:none;}

.ws-instructions::-webkit-scrollbar-thumb{background:rgba(247,223,30,.3);}
.ins-badge{display:inline-flex;align-items:center;gap:6px;background:var(--neon-dim);border:1px solid var(--border2);border-radius:100px;padding:3px 12px;font-size:11px;font-weight:700;color:var(--neon);letter-spacing:.5px;width:fit-content;}
.ins-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;color:#fff;line-height:1.35;}

.ins-body{font-size:14px;line-height:1.9;color:var(--text);display:flex;flex-direction:column;gap:12px;}
.ins-body h4{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:var(--accent);margin-top:4px;}
.ins-body p{margin:0;}
.ins-body ul{padding-right:20px;display:flex;flex-direction:column;gap:5px;}
.ins-body strong{color:#fff;}
.ins-body code{background:rgba(247,223,30,.08);border:1px solid rgba(247,223,30,.18);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#ffe580;direction:ltr;display:inline-block;unicode-bidi:isolate;}

<template id="tpl-s1">
<p>لو <strong>HTML</strong> هو هيكل صفحة الويب (العضم)، و<strong>CSS</strong> هو الشكل والألوان (الملابس)... يبقى <strong>JavaScript</strong> هو العقل والحركة. هي اللي بتخلي الصفحة "تفكر" وترد على اللي بتعمله.</p>
<p>كل حاجة بتتفاعل معاها في أي موقع أو تطبيق — زرار بيتلوّن لما تدوس عليه، فورم بيقولك "الإيميل غلط" قبل ما ترسله، فيسبوك بيجيب بوستات جديدة من غير ريفريش، لعبة كاملة بتتلعب جوا المتصفح — كل ده JavaScript.</p>
<div class="note"><strong>معلومة سريعة:</strong> JavaScript اتكتبت في 10 أيام بس سنة 1995، ودلوقتي هي أكتر لغة برمجة مستخدمة في العالم. بيها تقدر تبني مواقع، تطبيقات موبايل، سيرفرات كاملة (Node.js)، وحتى ألعاب — زي اللي بنعملها إحنا في PhineX Group.</div>
<p>هنتعلمها هنا بطريقة عملية 100%: كل مفهوم جديد، هتطبقه بإيدك فورًا في نفس الصفحة دي — بالظبط زي أشهر منصات تعلّم البرمجة في العالم، بس بالعامية المصرية وبطعم PhineX 🟡</p>
<h4>أول سطر كود في حياتك</h4>
<p>كل مبرمج في أي لغة بيبدأ بنفس الحاجة: طباعة رسالة على الشاشة. في JS بنستخدم <code>console.log()</code> وهو بيطبع أي حاجة تحطها جواه في لوحة اسمها <strong>Console</strong> (هي اللوحة على اليمين 👉).</p>
<pre><code>console.log("أي كلام تحب تطبعه");</code></pre>
<p>لاحظ: الكلام بيتحط بين قوسين <code>()</code>، وبين علامتي اقتباس <code>" "</code> لأنه نص. وفي الآخر بنحط فاصلة منقوطة <code>;</code> — زي النقطة في آخر الجملة، بتقول لـ JS "خلصت الأمر ده".</p>
</template>

<template id="tpl-s2">
<p>التعليقات (Comments) سطور بتكتبها جوا الكود، بس JavaScript بتتجاهلها تمامًا ومالهاش أي تأثير على التشغيل. وظيفتها الوحيدة إنها تفكّرك إنت — أو أي حد هيفتح الكود بعدك — "الجزء ده بيعمل إيه وليه".</p>
<h4>نوعين من التعليقات</h4>
<ul>
  <li><strong>تعليق سطر واحد:</strong> بنستخدم <code>//</code> وأي حاجة بعدها في نفس السطر بتتجاهل.</li>
  <li><strong>تعليق متعدد الأسطر:</strong> بنستخدم <code>/* ... */</code> لما نحتاج نشرح حاجة على أكتر من سطر.</li>
</ul>
<pre><code>// ده تعليق سطر واحد
let score = 0; // كمان ينفع تحطه بعد الكود في نفس السطر

/* ده تعليق
   على أكتر من سطر
   مفيد لو عايز تشرح حاجة كبيرة */</code></pre>
<div class="note">ليه أصلاً نكتب تعليقات؟ لأنك هترجع لكودك بعد شهر أو سنة ومش هتفتكر ليه كتبت السطر ده أصلاً! التعليق الكويس بيوفرلك وقت جبار، وأي شركة هتشتغل فيها هتقيّم وضوح كودك مش بس إنه "شغال".</div>
</template>

<template id="tpl-s3">
<p>تخيل المتغير (Variable) <strong>صندوق</strong> ليه اسم، وجواه قيمة. تقدر تفتحه تاني بعدين وتغيّر اللي جواه براحتك. في JS بنستخدم كلمة <code>let</code> عشان نعرّف صندوق زي ده — قيمته ممكن تتغير طول عمر البرنامج.</p>
<pre><code>let playerScore = 0;
playerScore = 10;              // غيّرنا القيمة، عادي جداً
playerScore = playerScore + 5; // بقت 15</code></pre>
<h4>قواعد تسمية المتغيرات</h4>
<ul>
  <li>لازم يبدأ بحرف (أو <code>_</code> أو <code>$</code>)، مش برقم</li>
  <li>ممنوع فيه مسافات — استخدم camelCase زي <code>heroName</code> مش <code>hero name</code></li>
  <li>حساسة لحالة الحروف — <code>score</code> و <code>Score</code> متغيرين مختلفين تمامًا!</li>
  <li>متستخدمش كلمة محجوزة زي <code>let</code> نفسها كاسم متغير</li>
</ul>
<div class="note">الاسم الكويس بيوصف اللي جوا الصندوق بوضوح. <code>let x = "أحمد"</code> شغالة، بس <code>let playerName = "أحمد"</code> أوضح بكتير — لأي حد هيقرا كودك، وأنت كمان بعد أسبوع.</div>
</template>

<template id="tpl-s4">
<p><code>const</code> زي <code>let</code> بالظبط، بفارق واحد جوهري: <strong>مينفعش تغيّر قيمته تاني بعد ما تحطها</strong>. لو حاولت، JS هترفض وتدّيك Error.</p>
<pre><code>const gameName = "El Jasus";
gameName = "لعبة تانية"; // ❌ TypeError: Assignment to constant variable</code></pre>
<p>القاعدة الذهبية: <strong>استخدم const افتراضياً لأي حاجة</strong>، وابقى استخدم let بس لو متأكد إن القيمة فعلاً هتتغير (زي score أو health في لعبة). ده بيخلي كودك أوضح، وبيمنعك تعمل غلطة عن طريق الخطأ.</p>
<div class="gotcha"><strong>⚠️ وإيه حكاية var؟</strong><br>قبل ما let و const يظهروا سنة 2015، كان فيه بس <code>var</code>. مشكلتها إنها بتتجاهل نطاق الـ <code>{ }</code> — يعني ممكن تعرّف متغير جوا if وتستخدمه بره من غير ما JS تعترض، وده بيسبب bugs غريبة وصعبة الاكتشاف. في أي شغل احترافي دلوقتي (وفي PhineX): <strong>متستخدمش var خالص</strong> — let أو const بس.</div>
</template>

<template id="tpl-s5">
<p>كل قيمة في JavaScript ليها "نوع". أهم 3 أنواع هتقابلهم كل يوم:</p>
<table class="type-table">
<tr><th>النوع</th><th>مثال</th><th>الاستخدام</th></tr>
<tr><td>String (نص)</td><td><code>"أهلاً"</code></td><td>أي كلام أو حروف</td></tr>
<tr><td>Number (رقم)</td><td><code>25</code></td><td>صحيح أو عشري، بدون اقتباس</td></tr>
<tr><td>Boolean (منطقي)</td><td><code>true</code></td><td>قرار بنعم أو لأ بس</td></tr>
</table>
<p>عشان تعرف نوع أي قيمة، استخدم <code>typeof</code>:</p>

<p><code>null</code>: عكسها تمامًا — إنت اللي بتحطها يدويًا عشان تقول "القيمة دي فاضية بالتحديد، وأنا قاصد كده".</p>

<div class="gotcha"><strong>حاجة غريبة في JS (اتقبلها بس متقلقش منها):</strong> لو كتبت <code>typeof null</code> هيديك <code>"object"</code> مش "null"! ده bug قديم جداً في اللغة نفسها اتقرر يفضل زي ما هو عشان تصليحه هيكسر مواقع كتير قوي. افتكرها كمعلومة غريبة بس، مش أكتر 😄</div>

<template id="tpl-s7">
<p>العمليات الحسابية الأساسية:</p>
<table class="type-table">
<tr><th>العملية</th><th>الرمز</th><th>مثال</th></tr>
<tr><td>جمع / طرح</td><td><code>+  -</code></td><td><code>5 + 3</code> → 8</td></tr>
<tr><td>ضرب / قسمة</td><td><code>*  /</code></td><td><code>5 * 3</code> → 15</td></tr>
<tr><td>باقي القسمة</td><td><code>%</code></td><td><code>7 % 2</code> → 1</td></tr>
<tr><td>زيادة/نقصان بواحد</td><td><code>++  --</code></td><td><code>xp++</code></td></tr>
</table>
<pre><code>let xp = 10;
xp = xp + 5;   // 15
xp += 5;       // طريقة مختصرة، بقت 20
xp++;          // بقت 21</code></pre>
<div class="gotcha"><strong>⚠️ فاكر من الخطوة الفاتت؟</strong><br><code>"5" + 5</code> = <code>"55"</code> (دمج نصوص، لأن فيه نص في العملية)<br><code>"5" - 5</code> = <code>0</code> (هنا JS بتحوّل النص لرقم تلقائيًا لأن الطرح مالهوش معنى للنصوص!)<br>ده اسمه <strong>Type Coercion</strong>، وهو مصدر أكتر bugs المبتدئين. لو مش متأكد، استخدم <code>Number(x)</code> عشان تحوّل نص لرقم بنفسك بدل ما تسيب JS تخمّن.</div>
<h4>عمليات المقارنة</h4>
<p>بترجعلك <code>true</code> أو <code>false</code>:</p>
<pre><code>console.log(5 == "5");   // true  😱 (بتقارن القيمة بس، وبتحوّل الأنواع)
console.log(5 === "5");  // false ✅ (بتقارن القيمة والنوع مع بعض)</code></pre>
<div class="note"><strong>القاعدة الذهبية التانية:</strong> استخدم <code>===</code> و <code>!==</code> دايماً، ومتستخدمش <code>==</code> أو <code>!=</code> خالص. كده بتتجنب مفاجآت الـ coercion تمامًا.</div>
</template>

/* ══════════════ محرّك الخطوات (State + Render) ══════════════ */
var currentIndex = 0;
var editor = document.getElementById('codeEditor');
var lnDiv = document.getElementById('lineNums');
var consoleBody = document.getElementById('consoleBody');
var wsBody = document.getElementById('wsBody');
var quizAnswers = {};

function doneKey(id) { return 'px_js_gs_done_' + id; }
function codeKey(id) { return 'px_js_gs_code_' + id; }
function isDone(id) { return localStorage.getItem(doneKey(id)) === '1'; }
function setDone(id) { localStorage.setItem(doneKey(id), '1'); }

function updateDots() {
  var track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STEPS.forEach(function (step, i) {
    var dot = document.createElement('div');
    dot.className = 'prog-dot' + (isDone(step.id) ? ' done' : '') + (i === currentIndex ? ' current' : '');
    track.appendChild(dot);
  });
}

function updateLN() {
  var n = editor.value.split('\n').length;
  var out = '';
  for (var i = 1; i <= n; i++) out += i + '<br>';
  lnDiv.innerHTML = out;
}

function saveCode() {
  var step = STEPS[currentIndex];
  if (step.type === 'code') localStorage.setItem(codeKey(step.id), editor.value);
}

function resetCode() {
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return;
  if (!confirm('إعادة ضبط الكود للنسخة الأصلية؟')) return;
  editor.value = step.starter;
  localStorage.removeItem(codeKey(step.id));
  updateLN();
  resetConsole();
}

function resetConsole() {
  consoleBody.innerHTML = '<div class="console-placeholder">اكتب كودك، واضغط ▶ تشغيل عشان تشوف النتيجة هنا...</div>';
}
function clearConsoleManual() { resetConsole(); }

function renderConsole(result) {
  consoleBody.innerHTML = '';
  if (result.logs.length === 0 && !result.error) {
    resetConsole();
    return;
  }
  result.logs.forEach(function (l) {
    var d = document.createElement('div');
    d.className = 'console-line';
    d.textContent = l;
    consoleBody.appendChild(d);
  });
  if (result.error) {
    var e = document.createElement('div');
    e.className = 'console-error';
    e.textContent = '⛔ ' + result.error;
    consoleBody.appendChild(e);
  }
}

function runCode() {
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return null;
  var result = runSandbox(editor.value, step.probeVars || []);
  renderConsole(result);
  return result;
}

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'ok') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 4200);
}

function checkStep() {
  var step = STEPS[currentIndex];
  if (step.type === 'quiz') { gradeQuiz(step); return; }
  var result = runCode();
  var verdict = step.check(result, editor.value);
  if (verdict.ok) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast(step.success || 'تمام! كمّل للي بعده 👍', 'ok');
  } else {
    toast(verdict.msg || 'حاول تاني، راجع التعليمات.', 'err');
  }
}

function renderTaskList(tasks) {
  var el = document.getElementById('taskList');
  if (!tasks || !tasks.length) { el.innerHTML = ''; return; }
  var html = '<div class="task-list-title">المطلوب في الخطوة دي</div>';
  tasks.forEach(function (t, i) {
    html += '<div class="task-item"><div class="task-num">' + (ARABIC_NUM[i + 1] || (i + 1)) + '</div><div>' + t + '</div></div>';
  });
  el.innerHTML = html;
}

function renderQuiz(step) {
  var wrap = document.getElementById('quizContainer');
  var html = '';
  step.questions.forEach(function (q, qi) {
    html += '<div class="quiz-q" id="quizQ' + qi + '">';
    html += '<div class="quiz-q-title">' + (ARABIC_NUM[qi + 1] || (qi + 1)) + '. ' + q.q + '</div>';
    q.options.forEach(function (opt, oi) {
      html += '<label class="quiz-opt"><input type="radio" name="qz' + qi + '" value="' + oi + '" onchange="quizAnswers[' + qi + ']=' + oi + '"> <span>' + opt + '</span></label>';
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function gradeQuiz(step) {
  var score = 0;
  step.questions.forEach(function (q, qi) {
    var qEl = document.getElementById('quizQ' + qi);
    qEl.classList.remove('correct', 'wrong');
    if (quizAnswers[qi] === q.correct) { qEl.classList.add('correct'); score++; }
    else if (quizAnswers[qi] !== undefined) { qEl.classList.add('wrong'); }
  });
  if (score === step.questions.length) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast('🏆 ' + score + '/' + step.questions.length + ' — ممتاز! الدرس خلص، يلا للمشروع العملي.', 'ok');
  } else {
    toast('حصلت على ' + score + '/' + step.questions.length + ' — راجع الأسئلة المعلّمة باللون الوردي وحاول تاني.', 'err');
  }
}

function finishLesson() {
  localStorage.setItem('px-js-getting-started', 'done');
  window.location.href = 'projects/character-card/step1.html';
}

function renderStep(i) {
  currentIndex = i;
  var step = STEPS[i];
  document.getElementById('stepLabel').textContent = (i + 1) + '/' + STEPS.length;
  updateDots();
  document.getElementById('insBadge').textContent = step.badge;
  document.getElementById('insTitle').textContent = step.title;
  var body = document.getElementById('insBody');
  body.innerHTML = '';
  body.appendChild(document.getElementById('tpl-' + step.id).content.cloneNode(true));
  renderTaskList(step.tasks);
  var hintEl = document.getElementById('hintBox');
  if (step.hint) { hintEl.style.display = 'block'; hintEl.innerHTML = '<strong>تلميح:</strong> ' + step.hint; }
  else { hintEl.style.display = 'none'; }

  var runBtn = document.getElementById('runBtn');
  var checkBtn = document.getElementById('checkBtn');

  if (step.type === 'quiz') {
    wsBody.classList.add('quiz-mode');
    quizAnswers = {};
    renderQuiz(step);
    runBtn.style.display = 'none';
    checkBtn.textContent = '✓ تحقق من الإجابات';
  } else {
    wsBody.classList.remove('quiz-mode');
    runBtn.style.display = 'inline-flex';
    checkBtn.textContent = '✓ تحقق من الخطوة';
    var saved = localStorage.getItem(codeKey(step.id));
    editor.value = (saved !== null) ? saved : step.starter;
    updateLN();
    resetConsole();
  }

  document.getElementById('prevBtn').disabled = (i === 0);
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.toggle('visible', isDone(step.id));
  nextBtn.textContent = (i === STEPS.length - 1) ? 'إنهاء الدرس 🚀' : 'التالي ←';

  localStorage.setItem('px_js_gs_last', i);
}

function goPrev() { if (currentIndex > 0) renderStep(currentIndex - 1); }
function goNext() {
  if (currentIndex === STEPS.length - 1) { finishLesson(); return; }
  if (currentIndex < STEPS.length - 1) renderStep(currentIndex + 1);
}

/* ══════════════ الإعداد الأولي ══════════════ */
var runTimer;
editor.addEventListener('input', function () {
  updateLN(); saveCode();
  clearTimeout(runTimer);
  runTimer = setTimeout(runCode, 700);
});
editor.addEventListener('scroll', function () { lnDiv.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  var s = editor.selectionStart, en = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
  editor.selectionStart = editor.selectionEnd = s + 2;
  updateLN(); saveCode();
});

(function init() {
  var start = 0;
  for (var i = 0; i < STEPS.length; i++) { if (!isDone(STEPS[i].id)) { start = i; break; } if (i === STEPS.length - 1) start = i; }
  renderStep(start);
})();
</script>
</body>
</html>
