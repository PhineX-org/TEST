  --text:#cdd6f4; --muted:#6b7a99; --accent:#a78bfa;

body{font-family:'Cairo',sans-serif;background:var(--void);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:3px;}

.load-overlay.hide{opacity:0;pointer-events:none;}
.load-atom{font-size:52px;animation:spin 2.4s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.load-title{font-family:'Syne',sans-serif;font-weight:800;font-size:1.1rem;color:#fff;}
.load-sub{font-size:12.5px;color:var(--muted);max-width:320px;text-align:center;line-height:1.8;}

.ws-sep{color:var(--muted);font-size:18px;}

.ws-step-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);margin-right:8px;flex-shrink:0;}

<!-- ══════════════ THEORY TEMPLATES ══════════════ -->

<template id="tpl-s1">
<p><strong>React</strong> مكتبة JavaScript لبناء واجهات المستخدم، عن طريق تقسيمها لـ <strong>مكونات (Components)</strong> صغيرة قابلة لإعادة الاستخدام — بيتها Facebook (Meta) وبتستخدمه Instagram وNetflix وAirbnb وآلاف الشركات.</p>
<h4>إيه هي JSX؟</h4>
<p>JSX صيغة بتخليك تكتب حاجة شكلها HTML جوا كود JavaScript. لكن انتبه: <strong>دي مش HTML حقيقي</strong> — بتتحول ورا الكواليس (بأداة اسمها Babel) لكود JavaScript عادي.</p>
<pre><code>// اللي إنت بتكتبه:
&lt;h1&gt;أهلاً بيك&lt;/h1&gt;

// اللي React بتشوفه فعلياً:
React.createElement('h1', null, 'أهلاً بيك')</code></pre>
<h4>المكوّن (Component)</h4>
<p>المكوّن هو مجرد <strong>دالة JavaScript عادية</strong> بترجع JSX يوصف شكل جزء من الواجهة:</p>
<pre><code>function Welcome() {
  return &lt;h1&gt;أهلاً بيك!&lt;/h1&gt;;
}</code></pre>
<div class="gotcha"><strong>⚠️ قاعدة مهمة جداً:</strong> اسم المكوّن <strong>لازم</strong> يبدأ بحرف كبير (PascalCase) — <code>Welcome</code> مش <code>welcome</code>. لو بدأته بحرف صغير، React هتفتكره وسم HTML عادي مش مكوّن، وهتفشل!</div>
</template>

<template id="tpl-s2">
<p>أقوى حاجة في React إنك تقدر تستخدم مكوّن جوا مكوّن تاني — ده اسمه <strong>Composition (التركيب)</strong>. كده بتقسم الواجهة الكبيرة لقطع صغيرة، كل قطعة مسؤولة عن حاجة واحدة.</p>
<pre><code>function Header() {
  return &lt;h1&gt;اسم الموقع&lt;/h1&gt;;
}

function App() {
  return (
    &lt;div&gt;
      &lt;Header /&gt;
      &lt;p&gt;محتوى الصفحة&lt;/p&gt;
    &lt;/div&gt;
  );
}</code></pre>
<div class="note"><strong>لاحظ:</strong> <code>&lt;Header /&gt;</code> بيتكتب زي أي HTML tag عادي، بس بحرف كبير في الأول — ده اللي بيميّزه كـ مكوّن React مش عنصر HTML.</div>
</template>

<template id="tpl-s3">
<p><strong>Props</strong> (اختصار Properties) هي إزاي تمرر بيانات <em>لجوا</em> المكوّن — تماماً زي ما تمرر arguments لدالة عادية.</p>
<pre><code>function Greeting(props) {
  return &lt;h2&gt;أهلاً يا {props.name}&lt;/h2&gt;;
}

// بتمررها زي attribute في الـ JSX:
&lt;Greeting name="أحمد" /&gt;</code></pre>
<p>لاحظ استخدام <code>{ }</code> جوا الـ JSX — ده بيخليك تحط أي تعبير JavaScript (متغير، عملية حسابية، أي حاجة) جوا الـ HTML اللي بتكتبه.</p>
<div class="note"><strong>تلميح احترافي:</strong> كتير من المبرمجين بيفكّوا الـ props مباشرة: <code>function Greeting({ name })</code> بدل <code>function Greeting(props)</code> ثم <code>props.name</code> — نفس النتيجة، أقصر.</p></div>
</template>

<template id="tpl-s4">
<p>لحد دلوقتي المكونات بتاعتنا "ثابتة" — مفيهاش حاجة بتتغيّر. الـ <strong>useState</strong> هو اللي بيدّي المكوّن "ذاكرة" بتتغيّر بمرور الوقت.</p>
<pre><code>const [count, setCount] = useState(0);
//     ↑        ↑              ↑
//   القيمة   دالة تغييرها   القيمة الابتدائية</code></pre>
<p>وعشان نخلي حاجة تحصل لما المستخدم يدوس، بنستخدم <code>onClick</code>:</p>
<pre><code>&lt;button onClick={() =&gt; setCount(count + 1)}&gt;
  زوّد
&lt;/button&gt;</code></pre>
<div class="gotcha"><strong>⚠️ أخطر فخ في React:</strong> <code>onClick={handleClick}</code> صح (بتمرر "إشارة" للدالة). لكن <code>onClick={handleClick()}</code> غلط — ده بينفذ الدالة <strong>فوراً</strong> وقت الرسم، مش وقت الدوسة! ولاحظ كمان: <code>onClick</code> بحرف C كبير، مش <code>onclick</code> زي HTML العادي.</div>
</template>

<template id="tpl-s5">
<p>عايز تعرض حاجة بس لو شرط معيّن اتحقق؟ استخدم <code>&&</code> جوا الـ JSX:</p>
<pre><code>{isVisible && &lt;p&gt;أنا ظاهر!&lt;/p&gt;}</code></pre>
<p>لو <code>isVisible</code> يساوي <code>true</code>، الـ <code>&lt;p&gt;</code> بيتعرض. لو <code>false</code>، React مابيعرضش حاجة خالص.</p>
<p>ولو عايز تختار بين حاجتين، استخدم <strong>Ternary</strong> (زي الشرط المختصر في JS):</p>
<pre><code>{isReady ? &lt;p&gt;جاهز!&lt;/p&gt; : &lt;p&gt;لسه لأ...&lt;/p&gt;}</code></pre>
</template>

<template id="tpl-s6">
<p>عندك array من البيانات وعايز تعرض كل عنصر فيها كـ JSX؟ استخدم <code>.map()</code>:</p>
<pre><code>const games = ["FIFA", "Fortnite"];

&lt;ul&gt;
  {games.map((game, i) =&gt;
    &lt;li key={i}&gt;{game}&lt;/li&gt;
  )}
&lt;/ul&gt;</code></pre>
<div class="gotcha"><strong>⚠️ الـ key إجباري!</strong> كل عنصر جوا <code>.map()</code> لازم يكون له <code>key</code> فريد. من غيره React هتديك تحذير في الـ Console، ومش هتقدر تتابع التغييرات في القائمة بكفاءة. الأفضل: استخدم id حقيقي لو موجود، أو الـ index كحل أخير.</div>
</template>

/* ══════════════ REACT ENGINE: تنفيذ JSX حقيقي عبر Babel ══════════════ */
var reactReady = false;

function PxErrorBoundary(props) { /* placeholder, replaced after React loads */ }

function initReactEngine() {
  PxErrorBoundary = class extends React.Component {
    constructor(p) { super(p); this.state = { error: null }; }
    static getDerivedStateFromError(error) { return { error: error }; }
    componentDidCatch() {}
    render() {
      if (this.state.error) return React.createElement('div', { className: 'px-render-error' }, '⛔ ' + this.state.error.message);
      return this.props.children;
    }
  };
  reactReady = true;
  document.getElementById('loadOverlay').classList.add('hide');
  document.getElementById('codeEditor').disabled = false;
  document.getElementById('runBtn').disabled = false;
  document.getElementById('checkBtn').disabled = false;
  renderStep(currentIndex);
}

function freshContainer() {
  var wrap = document.getElementById('previewInner');
  wrap.innerHTML = '';
  var div = document.createElement('div');
  wrap.appendChild(div);
  return div;
}

function runJSX(code) {
  return new Promise(function (resolve) {
    var container = freshContainer();
    var syncError = null;
    try {
      var transformed = Babel.transform(code, { presets: ['react'] }).code;
      function render(el) {
        var root = ReactDOM.createRoot(container);
        root.render(React.createElement(PxErrorBoundary, null, el));
      }
      var fn = new Function('React', 'useState', 'useEffect', 'render', transformed);
      fn(React, React.useState, React.useEffect, render);
    } catch (e) {
      syncError = e.message;
    }
    setTimeout(function () {
      var errEl = container.querySelector('.px-render-error');
      var err = syncError || (errEl ? errEl.textContent.replace('⛔ ', '') : null);
      resolve({ error: err, container: container });
    }, 90);
  });
}

/* ══════════════ محرّك الخطوات (State + Render) ══════════════ */
var currentIndex = 0;
var editor = document.getElementById('codeEditor');
var lnDiv = document.getElementById('lineNums');
var wsBody = document.getElementById('wsBody');
var quizAnswers = {};

function doneKey(id) { return 'px_react_gs_done_' + id; }
function codeKey(id) { return 'px_react_gs_code_' + id; }
function isDone(id) { return localStorage.getItem(doneKey(id)) === '1'; }
function setDone(id) { localStorage.setItem(doneKey(id), '1'); }

function updateDots() {
  var track = document.getElementById('progressTrack');
  track.innerHTML = '';
  STEPS.forEach(function (step, i) {
    var dot = document.createElement('div');
    dot.className = 'prog-dot' + (isDone(step.id) ? ' done' : '') + (i === currentIndex ? ' current' : '');
    track.appendChild(dot);
  });
}

function updateLN() {
  var n = editor.value.split('\n').length;
  var out = '';
  for (var i = 1; i <= n; i++) out += i + '<br>';
  lnDiv.innerHTML = out;
}

function saveCode() {
  var step = STEPS[currentIndex];
  if (step.type === 'code') localStorage.setItem(codeKey(step.id), editor.value);
}

function resetCode() {
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return;
  if (!confirm('إعادة ضبط الكود للنسخة الأصلية؟')) return;
  editor.value = step.starter;
  localStorage.removeItem(codeKey(step.id));
  updateLN();
  runCode();
}

async function runCode() {
  if (!reactReady) return null;
  var step = STEPS[currentIndex];
  if (step.type !== 'code') return null;
  return await runJSX(editor.value);
}

function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'ok') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(function () { el.classList.remove('show'); }, 4200);
}

async function checkStep() {
  if (!reactReady) return;
  var step = STEPS[currentIndex];
  if (step.type === 'quiz') { gradeQuiz(step); return; }
  var checkBtn = document.getElementById('checkBtn');
  checkBtn.disabled = true;
  var result = await runCode();
  var verdict = await step.check(result, editor.value);
  checkBtn.disabled = false;
  if (verdict.ok) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast(step.success || 'تمام! كمّل للي بعده 👍', 'ok');
  } else {
    toast(verdict.msg || 'حاول تاني، راجع التعليمات.', 'err');
  }
}

function renderTaskList(tasks) {
  var el = document.getElementById('taskList');
  if (!tasks || !tasks.length) { el.innerHTML = ''; return; }
  var html = '<div class="task-list-title">المطلوب في الخطوة دي</div>';
  tasks.forEach(function (t, i) {
    html += '<div class="task-item"><div class="task-num">' + (ARABIC_NUM[i + 1] || (i + 1)) + '</div><div>' + t + '</div></div>';
  });
  el.innerHTML = html;
}

function renderQuiz(step) {
  var wrap = document.getElementById('quizContainer');
  var html = '';
  step.questions.forEach(function (q, qi) {
    html += '<div class="quiz-q" id="quizQ' + qi + '">';
    html += '<div class="quiz-q-title">' + (ARABIC_NUM[qi + 1] || (qi + 1)) + '. ' + q.q + '</div>';
    q.options.forEach(function (opt, oi) {
      html += '<label class="quiz-opt"><input type="radio" name="qz' + qi + '" value="' + oi + '" onchange="quizAnswers[' + qi + ']=' + oi + '"> <span>' + opt + '</span></label>';
    });
    html += '</div>';
  });
  wrap.innerHTML = html;
}

function gradeQuiz(step) {
  var score = 0;
  step.questions.forEach(function (q, qi) {
    var qEl = document.getElementById('quizQ' + qi);
    qEl.classList.remove('correct', 'wrong');
    if (quizAnswers[qi] === q.correct) { qEl.classList.add('correct'); score++; }
    else if (quizAnswers[qi] !== undefined) { qEl.classList.add('wrong'); }
  });
  if (score === step.questions.length) {
    setDone(step.id);
    document.getElementById('nextBtn').classList.add('visible');
    updateDots();
    toast('🏆 ' + score + '/' + step.questions.length + ' — ممتاز! الدرس خلص.', 'ok');
  } else {
    toast('حصلت على ' + score + '/' + step.questions.length + ' — راجع الأسئلة المعلّمة باللون الوردي وحاول تاني.', 'err');
  }
}

function finishLesson() {
  localStorage.setItem('px-react-getting-started', 'done');
  window.location.href = 'menu.html';
}

function renderStep(i) {
  currentIndex = i;
  var step = STEPS[i];
  document.getElementById('stepLabel').textContent = (i + 1) + '/' + STEPS.length;
  updateDots();
  document.getElementById('insBadge').textContent = step.badge;
  document.getElementById('insTitle').textContent = step.title;
  var body = document.getElementById('insBody');
  body.innerHTML = '';
  body.appendChild(document.getElementById('tpl-' + step.id).content.cloneNode(true));
  renderTaskList(step.tasks);
  var hintEl = document.getElementById('hintBox');
  if (step.hint) { hintEl.style.display = 'block'; hintEl.innerHTML = '<strong>تلميح:</strong> ' + step.hint; }
  else { hintEl.style.display = 'none'; }

  var runBtn = document.getElementById('runBtn');
  var checkBtn = document.getElementById('checkBtn');

  if (step.type === 'quiz') {
    wsBody.classList.add('wide-mode');
    quizAnswers = {};
    renderQuiz(step);
    runBtn.style.display = 'none';
    checkBtn.textContent = '✓ تحقق من الإجابات';
  } else {
    wsBody.classList.remove('wide-mode');
    runBtn.style.display = 'inline-flex';
    checkBtn.textContent = '✓ تحقق من الخطوة';
    var saved = localStorage.getItem(codeKey(step.id));
    editor.value = (saved !== null) ? saved : step.starter;
    updateLN();
    if (reactReady) runCode();
  }

  document.getElementById('prevBtn').disabled = (i === 0);
  var nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.toggle('visible', isDone(step.id));
  nextBtn.textContent = (i === STEPS.length - 1) ? 'إنهاء الدرس 🚀' : 'التالي ←';
}

function goPrev() { if (currentIndex > 0) renderStep(currentIndex - 1); }
function goNext() {
  if (currentIndex === STEPS.length - 1) { finishLesson(); return; }
  if (currentIndex < STEPS.length - 1) renderStep(currentIndex + 1);
}

/* ══════════════ الإعداد الأولي ══════════════ */
var runTimer;
editor.addEventListener('input', function () {
  updateLN(); saveCode();
  clearTimeout(runTimer);
  runTimer = setTimeout(runCode, 700);
});
editor.addEventListener('scroll', function () { lnDiv.scrollTop = editor.scrollTop; });
editor.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  var s = editor.selectionStart, en = editor.selectionEnd;
  editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(en);
  editor.selectionStart = editor.selectionEnd = s + 2;
  updateLN(); saveCode();
});

(function init() {
  var start = 0;
  for (var i = 0; i < STEPS.length; i++) { if (!isDone(STEPS[i].id)) { start = i; break; } if (i === STEPS.length - 1) start = i; }
  currentIndex = start;
  document.getElementById('insBadge').textContent = STEPS[start].badge;
  document.getElementById('insTitle').textContent = STEPS[start].title;
  document.getElementById('insBody').appendChild(document.getElementById('tpl-' + STEPS[start].id).content.cloneNode(true));
  renderTaskList(STEPS[start].tasks);

  function boot() {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined' || typeof Babel === 'undefined') {
      setTimeout(boot, 50);
      return;
    }
    initReactEngine();
  }
  boot();
})();
</script>
</body>
